[workspace]
members = [
    "providers/aigw",
    "providers/aigw-core",
    "providers/aigw-openai",
    "providers/aigw-openai-compat",
    "providers/aigw-anthropic",
    "providers/aigw-gemini",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AprilNEA/aigateway"

[workspace.dependencies]
aigw = { version = "0.7.0", path = "providers/aigw" }
aigw-core = { version = "0.7.0", path = "providers/aigw-core" }
aigw-openai = { version = "0.7.0", path = "providers/aigw-openai" }
aigw-openai-compat = { version = "0.7.0", path = "providers/aigw-openai-compat" }
aigw-anthropic = { version = "0.7.0", path = "providers/aigw-anthropic" }
aigw-gemini = { version = "0.7.0", path = "providers/aigw-gemini" }

[package]
name = "aigateway"
version.workspace = true
edition.workspace = true
description = "A unified AI Gateway for multiple LLM providers"
license.workspace = true
repository.workspace = true

[dependencies]
aigw-anthropic.workspace = true
aigw-core.workspace = true
aigw-openai.workspace = true
aigw-openai-compat.workspace = true
anyhow = "1.0.103"
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3"
http = "1.4.2"
reqwest = { version = "0.12", features = ["charset", "http2", "json", "rustls-tls-webpki-roots", "stream"], default-features = false }
secrecy = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The umbrella crate is used only by the live OAuth E2E suite (tests/oauth_e2e.rs).
aigw = { workspace = true }

# Strip symbols from release builds → smaller distributed binaries.
[profile.release]
strip = true
